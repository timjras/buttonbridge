<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ButtonBridge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Montserrat:wght@800&family=Oswald:wght@600&family=Roboto+Condensed:wght@700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: HA-style sidebar page. Panel list | live panel with page tabs | Panel/Page/Key settings. YAML drawer under the panel. */
:root {
  --bg: #eef0f3; --surface: #ffffff; --surface-2: #f6f7f9; --ink: #1b1f25; --muted: #5b6370;
  --line: #dcdfe5; --accent: #2a63cf; --accent-ink: #ffffff; --accent-soft: #e3ebfa;
  --warn: #b4540a; --ok: #1f7a46; --danger: #c0392b;
  --deck: #0f1114; --deck-edge: #2a2d33;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --key: 88px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111317; --surface: #191c21; --surface-2: #1f2329; --ink: #e6e8eb; --muted: #9aa1ab;
  --line: #2b3038; --accent: #6b9bf2; --accent-ink: #0d1320; --accent-soft: #1d2a42;
  --warn: #f0a35e; --ok: #6fcf97; --danger: #ef7d6f; --deck: #07080a; --deck-edge: #30343b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111317; --surface: #191c21; --surface-2: #1f2329; --ink: #e6e8eb; --muted: #9aa1ab;
  --line: #2b3038; --accent: #6b9bf2; --accent-ink: #0d1320; --accent-soft: #1d2a42;
  --warn: #f0a35e; --ok: #6fcf97; --danger: #ef7d6f; --deck: #07080a; --deck-edge: #30343b; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45 }
button, input, select, textarea { font: inherit; color: inherit }
.wrap { padding-inline: 16px; padding-block: 12px 32px; max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px }
header h1 { font-size: 18px; font-weight: 600; margin: 0 }
.pill { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.spacer { flex: 1 }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; background: none; padding: 6px 14px; cursor: pointer; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 8px; cursor: pointer }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600 }
.btn.small { padding: 3px 10px; font-size: 13px }
.btn.danger { color: var(--danger) }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff }
button:focus-visible, input:focus-visible, select:focus-visible, canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.grid { display: grid; grid-template-columns: 210px minmax(0, 1fr) 330px; gap: 12px; align-items: start }
@media (max-width: 1050px) { .grid { grid-template-columns: minmax(0, 1fr) } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0 }
.card h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 12px 14px 6px; font-weight: 600 }

/* Sidebar */
.targets { list-style: none; margin: 0; padding: 0 6px 8px; display: flex; flex-direction: column; gap: 2px }
.targets button { width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 7px; cursor: pointer; display: flex; flex-direction: column }
.targets button[aria-current="true"] { background: var(--accent-soft) }
.targets .name { font-weight: 600 }
.targets .meta { font-size: 12px; color: var(--muted) }
.newpanel { margin: 4px 10px 12px; padding: 10px; border: 1px dashed var(--warn); border-radius: 8px; display: flex; flex-direction: column; gap: 6px }
.newpanel .meta { font-size: 12px; color: var(--muted) }
.newpanel code { font-family: var(--mono); font-size: 12.5px }
.newpanel input, .newpanel select { width: 100%; min-width: 0; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2) }

/* Stage */
.stagehead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 12px 14px 0 }
.stagehead h2 { padding: 0; font-size: 16px; letter-spacing: 0; text-transform: none; color: var(--ink) }
.stagehead .meta { color: var(--muted); font-size: 12.5px }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line) }
.tab { display: inline-flex; align-items: center; border-bottom: 2px solid transparent }
.tab[aria-selected="true"] { border-bottom-color: var(--accent) }
.tab > button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 7px 4px 7px 10px }
.tab[aria-selected="true"] > button.tabname { color: var(--ink); font-weight: 600 }
.tab .start { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-left: 4px; font-weight: 500 }
.tab .x { padding: 4px 8px; font-size: 15px; line-height: 1; border-radius: 6px }
.tab .x:hover { color: var(--danger); background: var(--surface-2) }
.tab.confirm { gap: 6px; padding: 4px 8px; color: var(--danger); font-size: 13px }
.tab.confirm button { padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface) }
.tabs .addpage { border: 0; background: none; cursor: pointer; color: var(--accent); padding: 7px 10px; font-weight: 500 }
.stage { padding: 20px 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; overflow-x: auto }
.deck { background: var(--deck); border: 1px solid var(--deck-edge); border-radius: 14px; padding: calc(var(--key) * .18); box-shadow: 0 6px 18px rgba(0,0,0,.25) }
.keys { display: grid; gap: calc(var(--key) * .22) }
.keys { transition: filter .3s }
.sched { display: grid; grid-template-columns: 1fr 64px 26px; gap: 6px; align-items: center }
.sched input { padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); width: 100%; min-width: 0 }
.sched .x { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px }
.inline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
.inline input[type=text], .inline input[type=number] { width: 72px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2) }
.inline.trig { gap: 4px; flex-wrap: nowrap; white-space: nowrap }
.inline.trig input[type=number] { width: 46px; padding: 4px 5px }
.inline.trig input[type=text] { width: 54px; padding: 4px 5px }
.key { width: var(--key); height: var(--key); border-radius: calc(var(--key) * .11); display: block; cursor: pointer; background: #1c1f24 }
.key.sel { outline: 3px solid var(--accent); outline-offset: 3px }
.strip { display: grid; margin-top: calc(var(--key) * .22); border-radius: calc(var(--key) * .08); overflow: hidden; transition: filter .3s }
.strip canvas { width: 100%; min-width: 0; display: block; cursor: pointer }
.strip canvas + canvas { border-left: 1px solid #000 }
.strip canvas.sel { outline: 3px solid var(--accent); outline-offset: -3px }
.knobs { display: grid; margin-top: calc(var(--key) * .2); justify-items: center }
.knob { width: calc(var(--key) * .62); height: calc(var(--key) * .62); border-radius: 50%; border: 2px solid #3a3e45; background: radial-gradient(circle at 35% 30%, #4a4f57, #1d2025 70%); cursor: pointer; padding: 0; color: #c9cdd3; font-size: 18px; line-height: 1 }
.knob.sel { outline: 3px solid var(--accent); outline-offset: 3px }
.turn { display: flex; gap: 3px; align-items: center }
.turn .knob { width: calc(var(--key) * .4); height: calc(var(--key) * .4) }
.turn button.step { border: 1px solid #3a3e45; background: #1d2025; color: #e6e8eb; border-radius: 6px; width: 22px; height: 22px; cursor: pointer; padding: 0; font-size: 15px; line-height: 1 }
.key.drop, .knob.drop { outline: 3px dashed #f2a516; outline-offset: 3px }
.strip canvas.drop { outline: 3px dashed #f2a516; outline-offset: -3px }
.strip.dragging canvas, .knobs.dragging .knob { cursor: grabbing }
.hint { color: var(--muted); font-size: 13px; text-align: center; max-width: 62ch; margin: 0 }
.trylog { font-family: var(--mono); font-size: 12.5px; color: var(--ok); min-height: 1.4em }

details.yaml { border-top: 1px solid var(--line) }
details.yaml summary { padding: 10px 14px; cursor: pointer; color: var(--muted); font-size: 13px }
details.yaml pre { margin: 0; padding: 0 14px 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; overflow-x: auto; white-space: pre }

/* Inspector */
.itabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px }
.itabs button { border: 0; background: none; padding: 10px 12px 8px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500 }
.itabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
.itabs button:disabled { opacity: .45; cursor: default }
.insp { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 14px }
.sect { display: flex; flex-direction: column; gap: 8px }
.sect > .head { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.field { display: flex; flex-direction: column; gap: 4px }
.field > label, .field > .lab { font-size: 12px; color: var(--muted); font-weight: 500 }
.field input[type=text], .field select, .field textarea { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); width: 100%; min-width: 0 }
.field textarea { font-family: var(--mono); font-size: 12.5px; resize: vertical; min-height: 54px }
.field .note { font-size: 12px; color: var(--muted) }
.field .note.bad { color: var(--danger) }
.field input[type=range] { width: 100% }
.kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px }
.kinds button { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); cursor: pointer; text-align: left; font-size: 13px; line-height: 1.25 }
.kinds button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600 }
.kinds svg { width: 18px; height: 18px; flex: none; fill: currentColor }
.looks { display: grid; gap: 8px }
.look { border: 1px solid var(--line); border-radius: 9px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2) }
.look .lt { display: flex; align-items: center; gap: 10px }
.look .lt strong { font-size: 13px }
.look .lt .state { font-family: var(--mono); font-size: 12px; color: var(--muted) }
.look canvas { width: 44px; height: 44px; border-radius: 6px; flex: none }
.iconbtn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); cursor: pointer; font-size: 13px }
.iconbtn svg { width: 18px; height: 18px; fill: currentColor }
.icons { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px }
.icons button { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); cursor: pointer; display: grid; place-items: center; padding: 0 }
.icons button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.icons svg { width: 74%; height: 74%; fill: currentColor }
.swrow { display: flex; align-items: center; gap: 8px }
.swrow .lab { font-size: 12px; color: var(--muted); width: 70px; flex: none }
.swatches { display: flex; gap: 4px; flex-wrap: wrap }
.swatches button { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--line); cursor: pointer; padding: 0 }
.swatches button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--surface) inset }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.empty { text-align: center; padding: 8px 0; display: flex; flex-direction: column; gap: 8px; align-items: center; color: var(--muted) }
.mono { font-family: var(--mono); font-size: 13px }
.states { display: flex; flex-direction: column; gap: 2px }
.states .state { font-size: 12px; font-family: var(--mono); color: var(--muted) }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px) }

@font-face { font-family: "MDI"; src: url("api/mdi.ttf") format("truetype"); font-display: block }
.mdi { font-family: "MDI"; font-size: 20px; line-height: 1; display: inline-block; width: 1em; text-align: center }
.icons .mdi { font-size: 22px }
.status { font-size: 13px; color: var(--muted) }
.status .bad { color: var(--danger) }
.btn:disabled { opacity: .5; cursor: default }
html, body { margin: 0; min-height: 100% }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>ButtonBridge</h1>
    <span class="pill" id="file">streamdeck.yaml</span>
    <span class="status" id="status"></span>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="Mode">
      <button id="mode-edit" aria-pressed="true">Edit</button>
      <button id="mode-try" aria-pressed="false">Try it</button>
    </div>
    <button class="btn primary" id="save">Save</button>
  </header>

  <div class="grid">
    <aside class="card" id="sidebar"></aside>
    <main class="card">
      <div class="stagehead" id="stagehead"></div>
      <div class="tabs" id="tabs"></div>
      <div class="stage" id="stage">
        <div id="decks"></div>
        <div class="trylog" id="trylog"></div>
        <p class="hint" id="hint"></p>
      </div>
      <details class="yaml">
        <summary>Show the YAML that Save writes</summary>
        <pre id="yaml"></pre>
      </details>
    </main>
    <aside class="card" id="inspector"></aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>


<script>
// The setup page. It keeps a model of every panel (S.panels), built from streamdeck.yaml by
// fromConfig() and turned back into the file's format by toConfig(). The server checks and
// writes the file; "Try it" runs real Home Assistant actions through the server.

// ---------- Icons: the Material Design Icons font, the same one the panels are drawn with ----------
let CODEPOINTS = {};
const glyph = n => { const c = CODEPOINTS[(n || "").replace(/^mdi:/, "")]; return c ? String.fromCodePoint(c) : ""; };
const svgIcon = n => `<span class="mdi" aria-hidden="true">${glyph(n) || "?"}</span>`;
const COMMON_ICONS = ["lightbulb", "lightbulb-outline", "lightbulb-on", "ceiling-light", "ceiling-light-outline", "lamp", "floor-lamp", "led-strip-variant",
  "power", "fan", "garage", "garage-open", "window-shutter", "window-shutter-open", "blinds", "lock", "lock-open", "door", "thermometer", "water", "music",
  "television", "speaker", "weather-sunny", "weather-night", "home", "home-lightbulb", "bed", "sofa", "star", "clock-outline", "folder", "arrow-left",
  "arrow-right", "play", "cog", "book-open-variant", "head-lightbulb", "silverware-fork-knife", "coffee"];

// ---------- Colours: the names the config file uses, with the panel's own values ----------
const COLORS = { black: "#000000", dark: "#1c1c1e", grey: "#5f6368", white: "#ffffff", amber: "#ffb300", blue: "#0a84ff", green: "#30d158", red: "#ff453a", purple: "#bf5af2" };
const lightBg = bg => ["amber", "white"].includes(bg) || (/^#/.test(bg || "") && lum(bg) > 160);
const lum = h => { const n = parseInt(h.slice(1), 16); return .299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255); };
const hex = c => COLORS[c] || c || "#000000";

const SIZES = {
  mini: { label: "Stream Deck Mini (6 keys)", cols: 3, rows: 2 },
  module6: { label: "Module, 6 keys", cols: 3, rows: 2 },
  module15: { label: "Module, 15 keys", cols: 5, rows: 3 },
  module32: { label: "Module, 32 keys", cols: 8, rows: 4 },
  plus: { label: "Stream Deck + (8 keys, 4 dials)", cols: 4, rows: 2, dials: 4 },
};
// A dial's icon and bar colour by what it controls, as the panel draws them.
const DIAL_DEFAULTS = { light: ["mdi:lightbulb", "amber"], media_player: ["mdi:volume-high", "blue"], cover: ["mdi:window-shutter", "green"],
  climate: ["mdi:thermostat", "red"], fan: ["mdi:fan", "blue"], input_number: ["mdi:tune-variant", "purple"], number: ["mdi:tune-variant", "purple"], timer: ["mdi:timer-outline", "red"] };
const DIAL_DOMAINS = Object.keys(DIAL_DEFAULTS);
const DIAL_STEPS = { light: "5%", media_player: "2%", cover: "5%", climate: "its own step, usually 0.5°", fan: "its own step, usually 10%", input_number: "the helper's step", number: "its own step", timer: "1 minute" };
const defaultPress = e => { const d = domainOf(e); return d === "media_player" ? "play or pause" : d === "timer" ? "start, pause or resume" : !d || ["sensor", "binary_sensor", "weather", "sun", "input_number", "number"].includes(d) ? "nothing" : "toggle it"; };

// What each kind of entity's two states are called, and the look each state gets by default.
const DOMAINS = {
  light: { states: ["on", "off"], on: { icon: "mdi:lightbulb-on", bg: "amber", fg: null }, off: { icon: "mdi:lightbulb-outline", bg: "black", fg: "grey" } },
  switch: { states: ["on", "off"], on: { icon: "mdi:power", bg: "blue", fg: null }, off: { icon: "mdi:power", bg: "black", fg: "grey" } },
  input_boolean: { states: ["on", "off"], on: { icon: "mdi:toggle-switch", bg: "blue", fg: null }, off: { icon: "mdi:toggle-switch-off", bg: "black", fg: "grey" } },
  fan: { states: ["on", "off"], on: { icon: "mdi:fan", bg: "blue", fg: null }, off: { icon: "mdi:fan", bg: "black", fg: "grey" } },
  cover: { states: ["open", "closed"], on: { icon: "mdi:window-shutter-open", bg: "grey", fg: null }, off: { icon: "mdi:window-shutter", bg: "black", fg: "grey" } },
  lock: { states: ["unlocked", "locked"], on: { icon: "mdi:lock-open", bg: "red", fg: null }, off: { icon: "mdi:lock", bg: "green", fg: null } },
  media_player: { states: ["playing", "paused"], on: { icon: "mdi:music", bg: "purple", fg: null }, off: { icon: "mdi:music", bg: "black", fg: "grey" } },
  timer: { states: ["active", "idle"], on: { icon: "mdi:timer-sand", bg: "red", fg: null }, off: { icon: "mdi:timer-outline", bg: "black", fg: "grey" }, paused: { icon: "mdi:timer-pause-outline", bg: "grey", fg: null } },
  binary_sensor: { states: ["on", "off"], on: { icon: "mdi:door-open", bg: "red", fg: null }, off: { icon: "mdi:door", bg: "black", fg: "grey" } },
};
const domainOf = e => (e || "").split(".")[0];
const twoState = e => !!DOMAINS[domainOf(e)];
const INFO_DOMAINS = ["sensor", "binary_sensor", "weather", "sun", "camera", "person", "device_tracker", "zone"];

const KINDS = [
  ["device", "Control a device", "mdi:lightbulb"],
  ["area", "Control a room or floor", "mdi:home"],
  ["script", "Run a script or scene", "mdi:play"],
  ["timer", "Run a timer", "mdi:timer-outline"],
  ["page", "Go to another page", "mdi:folder"],
  ["back", "Go back", "mdi:arrow-left"],
  ["info", "Show a sensor", "mdi:thermometer"],
  ["custom", "Any HA action", "mdi:cog"],
];

// ---------- State ----------
const S = {
  entities: {}, names: {}, dialInfo: {}, areas: {}, floors: {}, bridges: [], sun: {}, file: "",
  panels: {}, rawTop: {}, dirty: false, problems: [],
  view: { panel: null, page: null, sel: null, dial: null, mode: "edit", tab: "page", history: [], iconFor: null, iconSearch: "", confirmPage: null, armed: null },
};
const P = () => S.panels[S.view.panel];
const PAGE = () => P()?.pages[S.view.page];
const dims = p => SIZES[p.size] || SIZES.mini;
const DIALS = pg => pg.dials || (pg.dials = {});
const areaLights = b => b.scope === "floor" ? Object.values(S.areas).filter(a => a.floor === b.target).flatMap(a => a.lights) : (S.areas[b.target]?.lights || []);
const anyOn = b => areaLights(b).some(e => S.entities[e] === "on");
const placeName = b => b.scope === "floor" ? (S.floors[b.target] || b.target) : (S.areas[b.target]?.name || b.target);

// ---------- From the file to the model, and back ----------
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const omit = (o, keys) => Object.fromEntries(Object.entries(o || {}).filter(([k]) => !keys.includes(k)));
const lookFrom = (l, base) => ({ icon: l?.icon ?? base?.icon ?? null, bg: l?.background ?? base?.bg ?? null, fg: l?.icon_color ?? base?.fg ?? null });
const lookTo = l => { const o = {}; if (l.icon) o.icon = l.icon; if (l.bg) o.background = l.bg; if (l.fg) o.icon_color = l.fg; return o; };
const stateTemplate = e => new RegExp(`\\{\\{\\s*states\\(\\s*['"]${(e || "").replace(/\./g, "\\.")}['"]\\s*\\)\\s*\\}\\}`, "g");

function buttonFrom(raw) {
  const tap = raw.tap, e = raw.entity || "", d = domainOf(e);
  const b = { raw: clone(raw), entity: e, label: raw.text || "", labelPos: raw.text_position || "bottom", confirm: !!raw.confirm, asleep: !!raw.asleep, tap: "toggle" };

function morePresses(b) {
  const own = b.kind === "area"
    ? [["toggle", "Toggle the lights"], ["turn_on", "Turn all the lights on"], ["turn_off", "Turn all the lights off"]]
    : b.kind === "timer" ? [["turn_off", "Cancel the timer"], ["turn_on", "Start it again from the beginning"], ["toggle", "Start, pause or resume"]]
    : [["toggle", "Toggle it"], ["turn_on", "Turn it on (or open it)"], ["turn_off", "Turn it off (or close it)"]];
  const dims = [["dim_brighten", "Dim or brighten while held (alternates)"], ["brighten", "Brighten while held"], ["dim", "Dim while held"]];
  const kinds = [...(canOwn(b) ? own : []), ["script", "Run a script or scene"], ["page", "Go to another page"], ["back", "Go back"], ["custom", "Any HA action"]];
  const fields = w => {
    const x = b.extra[w], id = `k-${w}`, list = w === "hold" && canDim(b) ? [...dims, ...kinds] : kinds;
    let f = `<div class="field"><label for="${id}-kind">${EXTRA_NAMES[w]} action</label><select id="${id}-kind">${list.map(([k, l]) => `<option value="${k}"${x.kind === k ? " selected" : ""}>${l}</option>`).join("")}</select></div>`;
    const ent = (domains, label, note) => `<div class="field"><label for="${id}-entity">${label}</label><input type="text" id="${id}-entity" list="${id}-list" value="${esc(x.entity)}" placeholder="Start typing a name or ID" autocomplete="off">
      <datalist id="${id}-list">${Object.keys(S.entities).filter(e => !domains || domains.includes(domainOf(e))).sort().map(e => `<option value="${e}">${esc(S.names[e] || "")}</option>`).join("")}</datalist>${note ? `<span class="note">${note}</span>` : ""}</div>`;
    if (x.kind === "script") f += ent(["script", "scene"], "Script or scene");
    if (x.kind === "page") f += `<div class="field"><label for="${id}-page">Page to open</label>${pageSelect(`${id}-page`, x.page)}</div>`;
    if (DIM.includes(x.kind)) f += `<span class="note" style="font-size:12px;color:var(--muted)">Changes the brightness ${DIM_STEP_PCT}% at a time until you let go. ${x.kind === "dim_brighten" ? "Each hold goes the other way from the last one. " : ""}Dimming stops at 1% rather than turning the lights off.${b.kind === "area" ? " Only lights that are on change, unless all are off." : ""}</span>`;
    if (x.kind === "custom") f += `<div class="field"><label for="${id}-action">Action</label><input type="text" id="${id}-action" value="${esc(x.action)}" placeholder="e.g. light.turn_on"></div>`
      + ent(null, "Entity (optional)", "")
      + `<div class="field"><label for="${id}-data">Extra data (optional)</label><textarea id="${id}-data" placeholder="brightness_pct: 20">${esc(x.data)}</textarea></div>`;
    return `<div style="padding-left:22px;display:flex;flex-direction:column;gap:8px">${f}</div>`;
  };
  return `<div class="sect" id="k-more"><span class="head">Long and double press</span>
    ${["hold", "double"].map(w => `<div class="field"><label><input type="checkbox" id="k-${w}-on"${b.extra[w].on ? " checked" : ""}> ${EXTRA_NAMES[w]}</label></div>${b.extra[w].on ? fields(w) : ""}`).join("")}
    <span class="note" style="font-size:12px;color:var(--muted)">Long press: hold the key for half a second. Double press: two quick presses. Only keys with a double press wait a moment before a single tap runs.</span></div>`;
}

// When a button changes kind, its long and double press keep their actions, unless they acted on a device it no longer has.
function fixExtras(b) {
  for (const w of ["hold", "double"]) {
    const x = b.extra[w];
    if (x.on && ((OWN.includes(x.kind) && !canOwn(b)) || (DIM.includes(x.kind) && !canDim(b)))) x.kind = "script";
  }
}

}

// ---------- Server ----------
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
function takeEntities(list) {
  S.entities = Object.fromEntries(Object.entries(list).map(([k, v]) => [k, v.state]));
  S.names = Object.fromEntries(Object.entries(list).map(([k, v]) => [k, v.name]));
  S.dialInfo = Object.fromEntries(Object.entries(list).filter(([, v]) => v.dial).map(([k, v]) => [k, v.dial]));
}
async function load() {
  const [icons, st] = await Promise.all([api("api/icons"), api("api/state")]);
  CODEPOINTS = icons;
  takeEntities(st.entities);
  S.areas = Object.fromEntries(st.areas.map(a => [a.id, a]));
  S.floors = Object.fromEntries(st.floors.map(f => [f.id, f.name]));
  S.bridges = st.bridges; S.sun = st.sun; S.file = st.file;
  S.rawTop = st.config || {};
  S.panels = Object.fromEntries(Object.entries(st.config?.panels || {}).map(([n, p]) => [n, panelFrom(n, p)]));
  S.problems = st.problems;
  const first = Object.keys(S.panels)[0];
  Object.assign(S.view, { panel: first || null, page: first ? S.panels[first].start : null });
  if (first && !S.panels[first].pages[S.view.page]) S.view.page = Object.keys(S.panels[first].pages)[0];
  $("file").textContent = st.file.split("/").pop();
  render();
  if (st.problems.length) toast(`${st.file.split("/").pop()} has problems: the page shows what it could read.`);
}
async function poll() {
  try {
    const r = await api("api/entities");
    const before = JSON.stringify([S.entities, S.dialInfo]), bridges = JSON.stringify(S.bridges);
    takeEntities(r.entities); S.bridges = r.bridges;
    if (JSON.stringify([S.entities, S.dialInfo]) !== before) { drawAllKeys(); applyBrightness(); if (S.view.mode === "try") renderInspector(); }
    if (JSON.stringify(S.bridges) !== bridges) renderSidebar();
  } catch (e) { /* the next poll retries */ }
}

// ---------- Actions ----------
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3500); }
function newPage(base = "page") { const p = P(); let n = 1; while (p.pages[`${base}_${n}`]) n++; const name = `${base}_${n}`; p.pages[name] = { raw: {}, buttons: {}, dials: {}, tapAny: null, brightness: null, image: null }; return name; }
function eachLink(fn) {
  for (const pg of Object.values(P().pages)) {
    for (const b of Object.values(pg.buttons)) {
      if (b.kind === "page") fn(b, "page");
      for (const w of ["hold", "double"]) if (b.extra?.[w]?.on && b.extra[w].kind === "page") fn(b.extra[w], "page");
    }
    for (const d of Object.values(DIALS(pg))) if (d.press === "page") fn(d, "page");
  }
}
function deletePage(name) {
  const p = P(); let broken = 0;
  delete p.pages[name];
  if (p.sleep.page === name) p.sleep.page = "";
  eachLink((o, f) => { if (o[f] === name) { o[f] = null; broken++; } });
  if (p.start === name) p.start = Object.keys(p.pages)[0];
  Object.assign(S.view, { page: p.start, sel: null, dial: null, tab: "page", confirmPage: null, armed: null, history: [] });
  S.dirty = true; render(); toast(`Deleted page “${name}”.${broken ? ` ${broken} button(s) that opened it now need a new page.` : ""}`);
}
function blankButton(kind) {
  const base = { raw: {}, kind, entity: "", label: "", labelPos: "bottom", confirm: false, tap: "toggle", extra: { hold: extraFrom(null), double: extraFrom(null) }, look: { icon: KINDS.find(k => k[0] === kind)[2], bg: "black", fg: null } };
  if (kind === "page") { const other = Object.keys(P().pages).find(n => n !== S.view.page); base.page = other || newPage(); base.label = base.page; }
  if (kind === "back") base.label = "Back";
  if (kind === "area") { const a = Object.keys(S.areas)[0] || ""; Object.assign(base, { scope: "area", target: a, label: S.areas[a]?.name || "", looks: { on: { icon: "mdi:home-lightbulb", bg: "amber", fg: null }, off: { icon: "mdi:home-lightbulb-outline", bg: "black", fg: "grey" } } }); }
  return base;
}
function setEntity(b, e) {
  const oldAuto = b.label === autoLabel(b.entity);
  b.entity = e; const d = DOMAINS[domainOf(e)], known = S.entities[e] !== undefined;

// Try it: what a press does, using the page's unsaved model.
async function tryPress(n) {
  const v = S.view, page = PAGE(), b = page.buttons[n], log = $("trylog");

  if (b.kind === "page" && b.page) { v.history.push(v.page); v.page = b.page; render(); log.textContent = `Opened page ${b.page}`; return; }
  if (b.kind === "back") { goBack(); return; }
  if (b.tap === "none" && ["device", "area"].includes(b.kind)) { log.textContent = "Tapping this key does nothing"; return; }
  if (b.kind === "info") { log.textContent = `${S.names[b.entity] || b.entity}: ${S.entities[b.entity]}`; return; }

  catch (e) { log.textContent = `Didn't run: ${e.message}`; }
  drawAllKeys();
}

  try { const r = await api("api/turn", { dial: omit(dialTo(d, 1), ["dial"]), detents: by }); log.textContent = r.ran ? `${S.names[d.entity] || d.entity}: ${r.text}` : "Turning does nothing for this entity"; setTimeout(poll, 400); setTimeout(poll, 1500); }

function goBack() { const v = S.view; if (v.history.length) { v.page = v.history.pop(); render(); $("trylog").textContent = "Went back"; } else $("trylog").textContent = "Already on the first page"; }

async function save() {

// Drag one key onto another to swap them, or one dial (its knob or its part of the strip) onto another dial.
// Keys only swap with keys and dials only with dials.
let dragFrom = null;
const DRAG_SEL = "canvas.key, canvas.dialseg, .knob[data-dial]";
const dragKind = el => el.matches("canvas.key") ? "key" : "dial";
const dragNum = el => +(el.dataset.key || el.dataset.dial);
const clearDrop = () => document.querySelectorAll(".drop").forEach(x => x.classList.remove("drop"));
// Where a drag would land: the same kind of thing, and not the one being dragged.
function dropTarget(e) {
  const t = e.target.closest?.(DRAG_SEL);
  if (!t || !dragFrom || S.view.mode !== "edit" || dragKind(t) !== dragFrom.kind || dragNum(t) === dragFrom.n) return null;
  return t;
}
document.addEventListener("dragstart", e => {
  const el = e.target.closest?.(DRAG_SEL); if (!el || S.view.mode !== "edit") return;
  dragFrom = { kind: dragKind(el), n: dragNum(el) }; e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", `${dragFrom.kind} ${dragFrom.n}`); } catch {}
  // A knob is small: show the dial's strip picture under the pointer so it's clear what is moving.
  if (dragFrom.kind === "dial") { const seg = document.querySelector(`canvas.dialseg[data-dial="${dragFrom.n}"]`); if (seg && e.dataTransfer.setDragImage) try { e.dataTransfer.setDragImage(seg, seg.clientWidth / 2, seg.clientHeight / 2); } catch {} }
});
document.addEventListener("dragover", e => {
  const t = dropTarget(e); clearDrop(); if (!t) return; e.preventDefault(); e.dataTransfer.dropEffect = "move";
  // Light up both halves of the target dial, the knob and its strip segment.
  if (dragFrom.kind === "dial") document.querySelectorAll(`[data-dial="${dragNum(t)}"]`).forEach(x => x.classList.add("drop")); else t.classList.add("drop");
});
document.addEventListener("dragend", () => { dragFrom = null; clearDrop(); });
document.addEventListener("drop", e => {
  const t = dropTarget(e); if (!t) return; e.preventDefault();
  const { kind, n: from } = dragFrom, to = dragNum(t), page = PAGE();
  const set = kind === "key" ? page.buttons : DIALS(page), a = set[from], b = set[to];
  if (a) set[to] = a; else delete set[to];
  if (b) set[from] = b; else delete set[from];
  Object.assign(S.view, kind === "key" ? { sel: to, dial: null } : { dial: to, sel: null }, { tab: "key", armed: null, iconFor: null });
  dragFrom = null; S.dirty = true; render();
});

  document.fonts.ready.then(drawAllKeys);
}
let lastW = 0; window.addEventListener("resize", () => { const w = $("stage").clientWidth; if (Math.abs(w - lastW) > 30) { lastW = w; renderStage(); } });
setInterval(() => { if (PAGE()?.image?.type === "clock") drawAllKeys(); }, 15000);
</script>
