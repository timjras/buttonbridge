name: ButtonBridge
version: "0.6.2"
# Kept from before the rename so existing installs update in place instead of becoming a new app.
slug: streamdeck_ha
description: Home Assistant buttons on Elgato Stream Decks, connected through ESP32 network bridges.
url: https://github.com/timjras/buttonbridge
arch:
  - aarch64
  - amd64
init: false
# Bridges are found over mDNS, which needs the host's network.
host_network: true
homeassistant_api: true
# The setup page, in Home Assistant's sidebar
ingress: true
ingress_port: 8099
panel_icon: mdi:view-grid-outline
panel_title: ButtonBridge
map:
  - homeassistant_config:rw
options:
  config_file: streamdeck.yaml
  debug: false
schema:
  config_file: str
  debug: bool
