dependencies:
  idf: ">=5.5.3"
  # The USB Host Library from the registry instead of ESP-IDF's own copy: ESP-IDF 5.5.6's
  # asserts on the ESP32-P4's high-speed interrupt OUT transfers, and 1.6.0 doesn't.
  espressif/usb: "^1.6.0"
  espressif/usb_host_hid: "^1.0.3"
  espressif/mdns: "*"
  # Wi-Fi on the ESP32-P4 board: its ESP32-C6 runs ESP-Hosted and the esp_wifi calls go to it
  # over SDIO. esp_hosted 2.x rather than the new 3.x line: 2.x is what Waveshare tests with
  # esp_wifi_remote 1.x. The C6's own firmware has to speak a compatible version.
  espressif/esp_wifi_remote:
    version: "~1.6.5"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: "~2.13.1"
    rules:
      - if: "target in [esp32p4]"
